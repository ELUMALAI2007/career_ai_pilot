{% extends "base.html" %}
{% block title %}Practice Mode — CareerPilot AI{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="glass-card p-4 mb-4 border-start border-primary border-4 rounded-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold text-white mb-1"><i class="fa-solid fa-play text-primary me-2"></i> Custom Practice Setup</h2>
                <p class="text-secondary mb-0">Customize Category, Topic, Level, and Question count for practice.</p>
            </div>
            <a href="{{ url_for('aptitude.index') }}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Aptitude Home</a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="glass-card p-4 border-0 shadow-sm">
                <form action="{{ url_for('aptitude.practice_start') }}" method="GET">
                    <!-- Category Select -->
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Select Category</label>
                        <select name="category_id" class="form-select bg-dark text-white border-secondary">
                            <option value="">All Categories</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Topic Select -->
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Select Topic</label>
                        <select name="topic" class="form-select bg-dark text-white border-secondary">
                            <option value="all">All Topics</option>
                            {% for t in all_topics %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Difficulty Select -->
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Select Difficulty Level</label>
                        <select name="difficulty" class="form-select bg-dark text-white border-secondary text-capitalize">
                            <option value="all">Adaptive (All Levels)</option>
                            {% for lvl in levels %}
                            <option value="{{ lvl }}">Level {{ loop.index0 }} — {{ lvl|title }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Question Limit -->
                    <div class="mb-4">
                        <label class="form-label text-secondary fw-semibold">Number of Questions</label>
                        <select name="limit" class="form-select bg-dark text-white border-secondary">
                            <option value="5">5 Questions</option>
                            <option value="10" selected>10 Questions</option>
                            <option value="15">15 Questions</option>
                            <option value="20">20 Questions</option>
                            <option value="30">30 Questions</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-6">
                        <i class="fa-solid fa-bolt me-2"></i> Start Practice Session
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
