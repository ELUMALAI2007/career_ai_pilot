{% extends "base.html" %}
{% block title %}Daily Study Planner - CareerPilot AI{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-calendar-check text-primary me-2"></i> Daily Study Planner</h2>
        <p class="text-muted mb-0">Organize your daily preparation checklist and track task completion.</p>
    </div>
</div>

<div class="glass-card p-4">
    <h5 class="fw-bold mb-3">Today's Preparation Checklist</h5>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="task1">
        <label class="form-check-label text-muted" for="task1">Complete 1 Quantitative Aptitude Quiz</label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="task2">
        <label class="form-check-label text-muted" for="task2">Solve 1 Medium DSA Array Challenge</label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="task3">
        <label class="form-check-label text-muted" for="task3">Conduct 1 AI Mock Interview Session</label>
    </div>
</div>
{% endblock %}
